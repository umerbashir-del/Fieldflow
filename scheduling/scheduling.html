<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FieldFlow — Scheduling</title>
  <link rel="stylesheet" href="scheduling.css" />
</head>
<body>
  <main>
    <div class="topbar">
      <div>
        <p class="eyebrow">FieldFlow · Scheduling</p>
        <h1>Field schedule</h1>
        <p class="muted" id="accountLine">Northstar Field Services</p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="theme-toggle" id="themeToggleBtn">Dark mode</button>
        <button type="button" id="newJobBtn">New job</button>
      </div>
    </div>

    <nav class="tabs">
      <button type="button" class="tab-btn active" data-tab="home">Home</button>
      <button type="button" class="tab-btn" data-tab="calendar">Calendar</button>
      <button type="button" class="tab-btn" data-tab="clients">Clients</button>
    </nav>

    <!-- Home -->
    <section id="homeView">
      <section class="grid" id="statusGrid"></section>
      <section style="margin-top:28px">
        <div class="section-header"><h2>Today</h2></div>
        <div id="todayList"></div>
      </section>
      <section style="margin-top:28px">
        <div class="section-header"><h2>Upcoming work</h2></div>
        <div id="upcomingList"></div>
      </section>
    </section>

    <!-- Calendar -->
    <section id="calendarView" hidden>
      <div class="cal-toolbar">
        <div class="mode-switch">
          <button type="button" class="mode-btn" data-mode="day">Day</button>
          <button type="button" class="mode-btn active" data-mode="week">Week</button>
          <button type="button" class="mode-btn" data-mode="month">Month</button>
        </div>
        <div class="cal-nav">
          <button type="button" class="btn-ghost" id="calPrevBtn">‹ Prev</button>
          <strong id="calLabel"></strong>
          <button type="button" class="btn-ghost" id="calNextBtn">Next ›</button>
          <button type="button" class="btn-ghost" id="calTodayBtn">Today</button>
        </div>
      </div>
      <div class="week-grid" id="weekGrid"></div>
      <div class="agenda-list" id="dayAgenda" hidden></div>
      <div class="month-grid" id="monthGrid" hidden></div>
    </section>

    <!-- Clients -->
    <section id="clientsView" hidden>
      <div class="section-header">
        <h2>Clients</h2>
        <button type="button" id="newClientBtn">New client</button>
      </div>
      <div class="client-list" id="clientList"></div>
    </section>
  </main>

  <!-- Job modal -->
  <div class="modal-backdrop" id="jobModalBackdrop" hidden>
    <div class="modal-card" id="jobModalCard">
      <h2 id="jobModalTitle">New job</h2>
      <div class="field">
        <label for="jobClient">Client</label>
        <select id="jobClient"></select>
      </div>
      <div class="field">
        <label for="jobTitle">Title</label>
        <input id="jobTitle" placeholder="e.g. HVAC inspection" />
      </div>
      <div class="field">
        <label for="jobDate">Date</label>
        <input id="jobDate" type="date" />
      </div>
      <div class="field">
        <label for="jobAssignee">Assignee</label>
        <select id="jobAssignee"></select>
      </div>
      <div class="field">
        <label for="jobStatus">Status</label>
        <select id="jobStatus"></select>
      </div>
      <div class="conflict-flag" id="jobConflictWarning" hidden style="margin-top:0"></div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteJobBtn" hidden>Delete</button>
        <span id="jobActionsSpacer"></span>
        <div class="modal-actions-right">
          <button type="button" class="btn-ghost" id="cancelJobBtn">Cancel</button>
          <button type="button" id="saveJobBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Client modal -->
  <div class="modal-backdrop" id="clientModalBackdrop" hidden>
    <div class="modal-card" id="clientModalCard">
      <h2 id="clientModalTitle">New client</h2>
      <div class="field">
        <label for="clientName">Name</label>
        <input id="clientName" placeholder="e.g. Evergreen Properties" />
      </div>
      <div class="field">
        <label for="clientCity">City</label>
        <input id="clientCity" placeholder="e.g. Raleigh" />
      </div>
      <div class="conflict-flag" id="clientNotice" hidden style="margin-top:0"></div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteClientBtn" hidden>Delete</button>
        <span id="clientActionsSpacer"></span>
        <div class="modal-actions-right">
          <button type="button" class="btn-ghost" id="cancelClientBtn">Cancel</button>
          <button type="button" id="saveClientBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="formatters.js"></script>
  <script src="date-utils.js"></script>
  <script src="scheduling.js"></script>
</body>
</html>
