<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FieldFlow — Page not found</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #132841; background: #f4f1ed; }
    * { box-sizing: border-box; }
    body { align-items: center; background: radial-gradient(circle at top, #f2e6df, #f4f1ed 62%); display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
    main { background: #fffcf8; border: 1px solid #d8c9be; border-radius: 20px; box-shadow: 0 8px 24px rgb(66 53 43 / 8%); max-width: 560px; padding: 44px; text-align: center; width: 100%; }
    .eyebrow { color: #8a4d36; font-size: .76rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    h1 { font-size: clamp(2.6rem, 10vw, 5rem); letter-spacing: -.06em; line-height: 1; margin: 18px 0 8px; }
    h2 { margin: 0 0 12px; }
    p { color: #5f6258; line-height: 1.55; }
    nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
    a { background: #132841; border: 1px solid #132841; border-radius: 9px; color: #fff; font-weight: 750; padding: 10px 14px; text-decoration: none; }
    a:hover, a:focus-visible { background: #29544f; }
    a.secondary { background: #fffcf8; color: #132841; }
    a:focus-visible { outline: 3px solid rgb(41 84 79 / 24%); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">FieldFlow</p>
    <h1>404</h1>
    <h2>We couldn’t find that page.</h2>
    <p>The link may be outdated, or the page may have moved. Choose a FieldFlow area to continue.</p>
    <nav aria-label="FieldFlow products">
      <a href="/scheduling/">Scheduling</a>
      <a href="/analytics/">Analytics</a>
      <a href="/support/">Support</a>
      <a class="secondary" href="/operations/">Operations</a>
      <a class="secondary" id="backLink" href="/scheduling/">Back</a>
    </nav>
  </main>
  <script>
    const backLink = document.getElementById('backLink');
    if (window.history.length > 1) backLink.addEventListener('click', (event) => { event.preventDefault(); window.history.back(); });
  </script>
</body>
</html>
