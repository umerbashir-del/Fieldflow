<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #c1683f; text-decoration: none; }
    a:hover { color: #a4502c; }
    @keyframes ff-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes ff-dot { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
    @keyframes ff-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    .ff-scroll::-webkit-scrollbar { width: 8px; }
    .ff-scroll::-webkit-scrollbar-thumb { background: #ddc9b5; border-radius: 999px; }
    .ff-scroll::-webkit-scrollbar-track { background: transparent; }
  </style>
</helmet>
<div style="min-height: 100vh; background: radial-gradient(120% 90% at 50% 0%, #f4e7da 0%, #faf4ec 55%); font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #2c1f17; display: flex; align-items: center; justify-content: center; padding: 32px 20px;">
  <div style="width: 100%; max-width: 680px; background: #ffffff; border: 1px solid #ecdccb; border-radius: 24px; box-shadow: 0 24px 60px -24px rgba(150, 70, 40, 0.28), 0 4px 16px rgba(60, 40, 25, 0.05); overflow: hidden; display: flex; flex-direction: column; max-height: 92vh;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; border-bottom: 1px solid #f0e6da; background: linear-gradient(180deg, #ffffff, #fdf8f2);">
      <div style="display: flex; align-items: center; gap: 14px; min-width: 0;">
        <div style="position: relative; flex-shrink: 0; width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(145deg, #c1683f, #a4502c); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px -6px rgba(150,70,40,.6); overflow: hidden;"><img src="./robot.png" alt="FieldFlow bot" style="width: 38px; height: 38px; object-fit: contain;" />
          <span style="position: absolute; right: -2px; bottom: -2px; width: 13px; height: 13px; border-radius: 999px; background: #4fae7a; border: 2.5px solid #fff;"></span>
        </div>
        <div style="min-width: 0;">
          <p style="margin: 0; font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #c1683f;">FieldFlow · Support</p>
          <h1 style="margin: 2px 0 0; font-size: 1.18rem; font-weight: 700; line-height: 1.1;">Support Assistant</h1>
          <p style="margin: 3px 0 0; font-size: .78rem; color: #8a7a6c;">Online · answers scoped to your account</p>
        </div>
      </div>
      <label style="display: flex; flex-direction: column; gap: 5px; flex-shrink: 0;">
        <span style="font-size: .62rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #9a8a7c;">Account</span>
        <div style="position: relative;">
          <select value="{{ accountId }}" onChange="{{ onAccountChange }}" style="appearance: none; -webkit-appearance: none; padding: 9px 34px 9px 13px; border: 1px solid #b3ccbd; border-radius: 10px; background: #e6f0ea; font: inherit; font-size: .82rem; font-weight: 600; color: #2c1f17; cursor: pointer; min-width: 210px;">
            <sc-for list="{{ accounts }}" as="a" hint-placeholder-count="1">
              <option value="{{ a.id }}">{{ a.name }}</option>
            </sc-for>
          </select>
          <span style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #8a7a6c; font-size: .7rem;">▾</span>
        </div>
      </label>
    </div>

    <div ref="{{ scrollRef }}" class="ff-scroll" style="flex: 1; overflow-y: auto; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px; background: #faf6ef;">
      <sc-for list="{{ messages }}" as="m" hint-placeholder-count="2">
        <div style="{{ m.rowStyle }}">
          <sc-if value="{{ m.showAvatar }}" hint-placeholder-val="{{ true }}">
            <div style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(145deg, #c1683f, #a4502c); display: flex; align-items: center; justify-content: center; overflow: hidden;"><img src="./robot.png" alt="bot" style="width: 25px; height: 25px; object-fit: contain;" /></div>
          </sc-if>
          <div style="{{ m.colStyle }}">
            <div style="{{ m.bubbleStyle }}">{{ m.text }}</div>
            <sc-if value="{{ m.hasJobs }}" hint-placeholder-val="">
              <div style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                <sc-for list="{{ m.jobs }}" as="j" hint-placeholder-count="3">
                  <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #fff; border: 1px solid #ecdccb; border-radius: 13px; box-shadow: 0 3px 10px rgba(60,40,25,.04); animation: ff-in .32s cubic-bezier(.2,.7,.3,1) both;">
                    <div style="flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px; background: #e8f0d5; color: #5f7d38; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;">
                      <span style="font-size: .58rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; opacity: .7;">{{ j.month }}</span>
                      <span style="font-size: 1rem; font-weight: 800;">{{ j.day }}</span>
                    </div>
                    <div style="flex: 1; min-width: 0;">
                      <div style="font-size: .88rem; font-weight: 700; color: #2c1f17;">{{ j.title }}</div>
                      <div style="font-size: .74rem; color: #8a7a6c; margin-top: 2px;">{{ j.meta }}</div>
                    </div>
                    <span style="{{ j.badgeStyle }}"><span style="{{ j.dotStyle }}"></span>{{ j.statusLabel }}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ m.source }}" hint-placeholder-val="">
              <span style="{{ m.sourceStyle }}">
                <span style="width: 5px; height: 5px; border-radius: 999px; background: currentColor; opacity: .7;"></span>{{ m.source }}
              </span>
            </sc-if>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{ typing }}" hint-placeholder-val="">
        <div style="display: flex; align-items: flex-end; gap: 10px;">
          <div style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(145deg, #c1683f, #a4502c); display: flex; align-items: center; justify-content: center; overflow: hidden;"><img src="./robot.png" alt="bot" style="width: 25px; height: 25px; object-fit: contain;" /></div>
          <div style="display: flex; gap: 5px; align-items: center; padding: 13px 16px; background: #fff; border: 1px solid #ecdccb; border-radius: 14px 14px 14px 4px;">
            <span style="width: 7px; height: 7px; border-radius: 999px; background: #c1683f; animation: ff-dot 1.1s infinite; animation-delay: 0s;"></span>
            <span style="width: 7px; height: 7px; border-radius: 999px; background: #c1683f; animation: ff-dot 1.1s infinite; animation-delay: .18s;"></span>
            <span style="width: 7px; height: 7px; border-radius: 999px; background: #c1683f; animation: ff-dot 1.1s infinite; animation-delay: .36s;"></span>
          </div>
        </div>
      </sc-if>
    </div>

    <div style="border-top: 1px solid #f0e6da; padding: 14px 24px 18px; background: #fff;">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 13px;">
        <sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="4">
          <button type="button" onClick="{{ s.onClick }}" style="background: #f5ece2; color: #c1683f; border: 1px solid #ecdccb; border-radius: 999px; padding: 7px 14px; font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer; transition: background .15s, transform .1s;" style-hover="{{ chipHover }}" style-active="{{ chipActive }}">{{ s.label }}</button>
        </sc-for>
      </div>
      <form onSubmit="{{ onSubmit }}" style="display: flex; gap: 10px; align-items: center;">
        <input ref="{{ inputRef }}" type="text" placeholder="Ask e.g. “How do I create a job?”" autocomplete="off" style="flex: 1; padding: 13px 15px; border: 1px solid #ddc9b5; border-radius: 12px; font: inherit; font-size: .9rem; background: #f8f1e9; outline: none; transition: border-color .15s, box-shadow .15s;" style-focus="{{ inputFocus }}" />
        <button type="submit" style="flex-shrink: 0; border: 0; border-radius: 12px; background: #2f6b4f; color: #fff; padding: 13px 20px; font: inherit; font-weight: 700; font-size: .88rem; cursor: pointer; display: flex; align-items: center; gap: 7px; transition: background .15s, transform .1s;" style-hover="{{ sendHover }}" style-active="{{ sendActive }}">Send <span style="font-size: 1rem; line-height: 1;">→</span></button>
      </form>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const ACCOUNTS = [
  { id: 'acct_northstar', name: 'Northstar Field Services', plan: 'Growth' },
  { id: 'acct_lighthouse', name: 'Lighthouse Maintenance Co.', plan: 'Starter' },
];
const CLIENTS = [
  { id: 'client_evergreen', account_id: 'acct_northstar', name: 'Evergreen Properties', city: 'Raleigh' },
  { id: 'client_harbor', account_id: 'acct_northstar', name: 'Harbor Dental Group', city: 'Durham' },
  { id: 'client_summit', account_id: 'acct_northstar', name: 'Summit Retail', city: 'Cary' },
  { id: 'client_bayside', account_id: 'acct_lighthouse', name: 'Bayside Logistics', city: 'Wilmington' },
];
const JOBS = [
  { id: 'job_101', account_id: 'acct_northstar', client_id: 'client_evergreen', title: 'HVAC inspection', scheduled_for: '2026-08-20', status: 'scheduled', assignee: 'Maya Chen' },
  { id: 'job_102', account_id: 'acct_northstar', client_id: 'client_harbor', title: 'Equipment calibration', scheduled_for: '2026-08-20', status: 'in_progress', assignee: 'Jordan Lee' },
  { id: 'job_103', account_id: 'acct_northstar', client_id: 'client_summit', title: 'Safety follow-up', scheduled_for: '2026-08-22', status: 'scheduled', assignee: 'Maya Chen' },
  { id: 'job_104', account_id: 'acct_northstar', client_id: 'client_evergreen', title: 'Filter replacement', scheduled_for: '2026-08-17', status: 'completed', assignee: 'Jordan Lee' },
  { id: 'job_201', account_id: 'acct_lighthouse', client_id: 'client_bayside', title: 'Dock door service', scheduled_for: '2026-08-21', status: 'scheduled', assignee: 'Priya Nair' },
];
const DOCS = [
  { title: 'Using FieldFlow', text: `# Using FieldFlow
## Jobs
You can see all your jobs, add new ones, and update them anytime. Each job has a client, a date, and a person assigned to it.
## Clients
Keep a simple list of your clients — just their name and city.
## Your company
Everything you add stays with your company, so your team is always looking at the same up-to-date information.` },
  { title: 'Getting started', text: `# Getting started
## Adding a client
Go to the Clients tab in Scheduling and add their name and city. That's all you need.
## Booking a job
Open Scheduling, tap New Job, then pick the client, the date, and who's handling it.` },
  { title: 'Good to know', text: `# Good to know
## Keeping things private
Your jobs and clients belong only to your company. You'll only ever see your own work, and no other company can see yours.
## Dates
Dates always show as Month Day, Year — for example, August 20, 2026.
## Job statuses
A job is always one of four: Scheduled, In progress, Completed, or Cancelled.` },
];
const FAQ = [
  { id: 'create-job', keywords: ['create','new','add','schedule','job','appointment','booking'], answer: "Open Scheduling and tap New Job — pick the client, date, and who's assigned. It saves straight to your company's account automatically.", source: 'Getting started' },
  { id: 'job-status', keywords: ['status','statuses','progress','complete','completed','cancel','cancelled','update'], answer: 'Every job is marked one of four ways: Scheduled, In progress, Completed, or Cancelled. Just tap the job to change it.', source: 'Getting started' },
  { id: 'add-client', keywords: ['client','clients','customer','customers'], answer: 'Add clients from the Clients tab in Scheduling. Keep it simple — just their name and city.', source: 'Getting started' },
  { id: 'account-scope', keywords: ['other','another','company','see','missing','scope','scoped','privacy','private','leak'], answer: "Your jobs and clients belong only to your company. You'll only ever see your own work — never another company's — and nobody else can see yours.", source: 'Privacy & security' },
  { id: 'date-format', keywords: ['date','dates','format','when'], answer: 'Dates always show as Month Day, Year — for example, August 20, 2026.', source: 'Getting started' },
  { id: 'contact-support', keywords: ['support','message','help','contact','human','agent'], answer: "Just send a message here in the chat and our support team will see it — they'll already know it's coming from your company.", source: 'Getting help' },
];
const STOPWORDS = new Set(['a','an','the','is','are','do','does','how','what','why','can','i','to','of','in','on','for','my','your','and','or','it','this','that','with','be','me','about','you']);
const SUGGESTIONS = [
  'How do I create a new job?',
  'What do job statuses mean?',
  "What's my plan?",
  "Why can't I see another company's jobs?",
  "What's on my schedule today?",
];

function formatDate(iso) {
  return new Intl.DateTimeFormat('en-US', { month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' }).format(new Date(`${iso}T00:00:00Z`));
}
function clientName(id) { return CLIENTS.find((c) => c.id === id)?.name ?? 'Unknown client'; }
function tokenize(t) { return t.toLowerCase().replace(/[^a-z0-9\s_]/g, ' ').split(/\s+/).filter((w) => w && !STOPWORDS.has(w)); }

function parseSections(doc) {
  const lines = doc.text.split('\n');
  const out = [];
  let cur = { heading: doc.title, body: [] };
  for (const line of lines) {
    const h2 = line.match(/^##\s+(.*)/);
    if (h2) { out.push(cur); cur = { heading: h2[1].trim(), body: [] }; }
    else if (/^#\s+/.test(line)) { continue; }
    else { cur.body.push(line); }
  }
  out.push(cur);
  return out.map((s) => ({ docTitle: doc.title, heading: s.heading, body: s.body.join('\n').trim() })).filter((s) => s.body.length > 0);
}
const SECTIONS = DOCS.flatMap(parseSections);
function searchDocs(query) {
  const qt = tokenize(query);
  if (!qt.length) return null;
  let best = null, bestScore = 0;
  for (const sec of SECTIONS) {
    const ht = tokenize(sec.heading), bt = tokenize(sec.body);
    let score = 0;
    qt.forEach((t) => { if (ht.includes(t)) score += 2; if (bt.includes(t)) score += 1; });
    if (score > bestScore) { bestScore = score; best = sec; }
  }
  return bestScore > 0 ? best : null;
}
function matchFaq(query) {
  const tokens = tokenize(query);
  let best = null, bestScore = 0;
  for (const e of FAQ) {
    const score = e.keywords.reduce((acc, k) => acc + (tokens.includes(k) ? 1 : 0), 0);
    if (score > bestScore) { bestScore = score; best = e; }
  }
  return best;
}
function findClientMention(lower) {
  let partial = null;
  for (const c of CLIENTS) {
    const name = c.name.toLowerCase();
    if (lower.includes(name)) return c;
    const first = name.split(' ')[0];
    if (!partial && first.length > 3 && new RegExp(`\\b${first}\\b`).test(lower)) partial = c;
  }
  return partial;
}
function getAnswer(rawQuery, accountId) {
  const query = rawQuery.trim();
  const account = ACCOUNTS.find((a) => a.id === accountId);
  if (!query) return { text: 'Ask me something like “How do I create a job?” or “What’s my plan?”' };
  const lower = query.toLowerCase();

  const jobIdMatch = lower.match(/\bjob_\d+\b/);
  if (jobIdMatch) {
    const job = JOBS.find((j) => j.id === jobIdMatch[0]);
    if (!job) return { text: `I can't find a job with id ${jobIdMatch[0]}.` };
    if (job.account_id !== accountId) return { text: `That job belongs to a different company, so I can't show it here — FieldFlow keeps every company's jobs separate.` };
    return { text: `${job.title} for ${clientName(job.client_id)} is ${job.status.replace('_', ' ')}, scheduled for ${formatDate(job.scheduled_for)} with ${job.assignee || 'Unassigned'}.` };
  }
  if (/\bplan\b|\bsubscription\b|which account|what account|my account\b/.test(lower)) {
    return { text: `You're on the ${account.name} account, ${account.plan} plan.` };
  }
  if (/how many client|client count|number of client/.test(lower)) {
    const count = CLIENTS.filter((c) => c.account_id === accountId).length;
    return { text: `${account.name} has ${count} client${count === 1 ? '' : 's'}.` };
  }
  const client = findClientMention(lower);
  if (client) {
    if (client.account_id !== accountId) return { text: `${client.name} isn't part of ${account.name}'s account, so I can't share their details here.` };
    const cj = JOBS.filter((j) => j.client_id === client.id);
    const open = cj.filter((j) => j.status !== 'completed' && j.status !== 'cancelled');
    return { text: `${client.name} is in ${client.city}. They have ${cj.length} job${cj.length === 1 ? '' : 's'} on file, ${open.length} still open.` };
  }
  if (/\btoday\b|\bupcoming\b|this week|next job|my schedule/.test(lower)) {
    const upcoming = JOBS.filter((j) => j.account_id === accountId && j.status !== 'completed' && j.status !== 'cancelled').sort((a, b) => a.scheduled_for.localeCompare(b.scheduled_for)).slice(0, 3);
    if (!upcoming.length) return { text: `${account.name} has no upcoming jobs right now.` };
    return {
      text: `Here's what's coming up for ${account.name}:`,
      jobs: upcoming.map((j) => ({ title: j.title, client: clientName(j.client_id), iso: j.scheduled_for, status: j.status, assignee: j.assignee })),
    };
  }
  const faq = matchFaq(lower);
  if (faq) return { text: faq.answer, source: faq.source };
  const doc = searchDocs(lower);
  if (doc) return { text: doc.body, source: doc.heading };
  return { text: "I'm not sure about that one yet. Try asking how to create a job, what the job statuses mean, why you only see your own company's work, or what plan you're on." };
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.inputRef = React.createRef();
    this.scrollRef = React.createRef();
    this.state = {
      accountId: 'acct_northstar',
      typing: false,
      messages: [{ role: 'bot', text: "Hi, I'm the FieldFlow assistant. Ask me setup or how-to questions, or ask about your account." }],
    };
  }
  componentDidUpdate() { this.scrollToBottom(); }
  componentDidMount() { this.scrollToBottom(); }
  scrollToBottom() {
    const el = this.scrollRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }
  send(text) {
    const trimmed = (text || '').trim();
    if (!trimmed || this.state.typing) return;
    this.setState((s) => ({ messages: [...s.messages, { role: 'user', text: trimmed }], typing: true }));
    const accountId = this.state.accountId;
    window.setTimeout(() => {
      const result = getAnswer(trimmed, accountId);
      this.setState((s) => ({ messages: [...s.messages, { role: 'bot', text: result.text, source: result.source, jobs: result.jobs }], typing: false }));
    }, 650);
  }
  renderVals() {
    const STATUS = {
      scheduled: { label: 'Scheduled', bg: '#eef0dd', fg: '#6d6e33', dot: '#9aa04b' },
      in_progress: { label: 'In progress', bg: '#f8ead2', fg: '#9a6412', dot: '#d69a3e' },
      completed: { label: 'Completed', bg: '#efe6dd', fg: '#7a6a5d', dot: '#a99a8b' },
      cancelled: { label: 'Cancelled', bg: '#f6e2db', fg: '#a2453a', dot: '#cf6b58' },
    };
    const bubbleBase = 'padding: 12px 15px; font-size: .9rem; line-height: 1.5; white-space: pre-line; word-wrap: break-word; animation: ff-in .32s cubic-bezier(.2,.7,.3,1) both;';
    const messages = this.state.messages.map((m, i) => {
      const isUser = m.role === 'user';
      const jobs = (m.jobs || []).map((j) => {
        const st = STATUS[j.status] || STATUS.scheduled;
        const d = new Date(`${j.iso}T00:00:00Z`);
        return {
          title: j.title,
          meta: `${j.client} · ${j.assignee || 'Unassigned'}`,
          month: new Intl.DateTimeFormat('en-US', { month: 'short', timeZone: 'UTC' }).format(d),
          day: new Intl.DateTimeFormat('en-US', { day: 'numeric', timeZone: 'UTC' }).format(d),
          statusLabel: st.label,
          badgeStyle: `display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 999px; font-size: .66rem; font-weight: 700; letter-spacing: .02em; background: ${st.bg}; color: ${st.fg};`,
          dotStyle: `width: 6px; height: 6px; border-radius: 999px; background: ${st.dot};`,
        };
      });
      return {
        text: m.text,
        source: m.source || '',
        jobs,
        hasJobs: jobs.length > 0,
        showAvatar: !isUser,
        rowStyle: `display: flex; align-items: flex-end; gap: 10px; ${isUser ? 'justify-content: flex-end;' : ''}`,
        colStyle: `display: flex; flex-direction: column; gap: 6px; max-width: 82%; ${isUser ? 'align-items: flex-end;' : ''}`,
        bubbleStyle: isUser
          ? `${bubbleBase} background: linear-gradient(145deg, #cf7449, #a4502c); color: #fff; border-radius: 16px 16px 4px 16px; box-shadow: 0 6px 16px -8px rgba(150,70,40,.55);`
          : `${bubbleBase} background: #fff; color: #2c1f17; border: 1px solid #ecdccb; border-radius: 16px 16px 16px 4px; box-shadow: 0 3px 10px rgba(60,40,25,.04);`,
        sourceStyle: 'display: inline-flex; align-items: center; gap: 6px; font-size: .68rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: #9a8a7c;',
      };
    });
    return {
      accounts: ACCOUNTS,
      accountId: this.state.accountId,
      messages,
      typing: this.state.typing,
      suggestions: SUGGESTIONS.map((label) => ({ label, onClick: () => this.send(label) })),
      inputRef: this.inputRef,
      scrollRef: this.scrollRef,
      chipHover: { background: '#eeddcb', transform: 'translateY(-1px)' },
      chipActive: { transform: 'translateY(0)' },
      sendHover: { background: '#22513b' },
      sendActive: { transform: 'scale(.97)' },
      inputFocus: { borderColor: '#c1683f', boxShadow: '0 0 0 3px rgba(193,104,63,.15)', background: '#fff' },
      onSubmit: (e) => {
        e.preventDefault();
        const v = this.inputRef.current ? this.inputRef.current.value : '';
        this.send(v);
        if (this.inputRef.current) this.inputRef.current.value = '';
      },
      onAccountChange: (e) => {
        const accountId = e.target.value;
        const account = ACCOUNTS.find((a) => a.id === accountId);
        this.setState((s) => ({ accountId, messages: [...s.messages, { role: 'bot', text: `Switched to ${account.name}. I'll scope account lookups to this account from now on.` }] }));
      },
    };
  }
}
</script>
</body>
</html>
